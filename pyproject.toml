[project]
name = "crew-self-check"
version = "0.0.0"
description = "Crew Self-Check: astronaut health self-assessment (NASA Space Apps 2026 prototype)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Pinned to the version verified in the 2026-11-14 spike (see docs/decisiones.md, D-017).
astronaut = ["flet[all]==1.1.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew_self_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["crew_self_check"]
